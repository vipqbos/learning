springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.example.zlv
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

server:
  port: 8123

ai:
  ollama:
    apiHost: "http://localhost.zlv.com:11434"
  websearch:
    searxng:
      url: "http://localhost.zlv.com:8080/search"
      nums: 10
      engines: "bing,duckduckgo,brave,mojeek,qwant,semantic_scholar"